{% extends "learning_logs/base.html" %}

{% block content %}

  <h1>Темы</h1>

  <ul class="list-group mb-3">
    {% for topic in topics %}
      <li class="list-group-item">
        <a href="{% url 'learning_logs:topic' topic.id %}">{{ topic.text }}</a>
      </li>
    {% empty %}
      <li class="list-group-item">Пока не добавлено ни одной темы.</li>
    {% endfor %}
  </ul>

  <a class="btn btn-primary" href="{% url 'learning_logs:new_topic' %}">Добавить новую тему</a>

{% endblock content %}
