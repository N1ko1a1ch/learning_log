{% extends "learning_logs/base.html" %}

{% block content %}
  <div class="row justify-content-center my-4">
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Темы</h2>
        <a class="btn btn-primary" href="{% url 'learning_logs:new_topic' %}">
          + Добавить тему
        </a>
      </div>

      <div class="card bg-white rounded-4 border-0 p-3">
        <div class="list-group list-group-flush">
          {% for topic in topics %}
            <a href="{% url 'learning_logs:topic' topic.id %}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 border-0 border-bottom">
              <span class="fs-5 fw-semibold text-primary">{{ topic.text }}</span>
              <span class="text-muted small">&rarr;</span>
            </a>
          {% empty %}
            <div class="text-center py-5 text-muted">
              <p class="fs-5 mb-2">Пока не добавлено ни одной темы.</p>
              <a class="btn btn-sm btn-outline-primary" href="{% url 'learning_logs:new_topic' %}">
                Создать первую тему
              </a>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
